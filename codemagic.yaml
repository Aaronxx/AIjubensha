workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Set up project
        script: |
          cd ios-client
          ls -la
      - name: Build iOS App
        script: |
          cd ios-client
          xcodebuild -list || true
          xcodebuild build \
            -project AIjubensha.xcodeproj \
            -scheme AIjubensha \
            -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios-client/build/**/*.app
    publishing:
      email:
        recipients:
          - aaronxx@example.com
        notify:
          success: true
          failure: true
