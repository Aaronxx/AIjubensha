<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>剧本选择页面</title>
<style>
:root {
  --bg1:#0A0E17; --bg2:#111827; --bg3:#1A1F2E; --bg4:#1E2433;
  --bd:#2A3040; --gold:#C9A96E; --goldLight:#DFC78A;
  --t1:#E8ECF1; --t2:#8B95A5; --t3:#5A6475;
  --blue:#4A7DFF; --purple:#9B7ED8; --green:#4CAF93; --orange:#E8954C;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg1);color:var(--t1);display:flex;justify-content:center;min-height:100vh;padding:20px}

.phone{width:430px;min-height:1382px;background:var(--bg1);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 0 40px rgba(0,0,0,0.5)}

/* Search Header */
.search-area{padding:12px 16px;border-bottom:1px solid var(--bd)}
.search-container{position:relative;width:100%}
.search-box{width:100%;height:36px;background:rgba(30,41,56,0.5);border-radius:18px;display:flex;align-items:center;padding:0 12px;position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px}
.search-icon::before{content:'';position:absolute;width:10px;height:10px;border:2px solid var(--t2);border-radius:50%;left:0;top:0}
.search-icon::after{content:'';position:absolute;width:2px;height:5px;background:var(--t2);right:-3px;top:6px;transform:rotate(-45deg)}
.search-input{width:100%;height:100%;background:transparent;border:none;color:var(--t1);font-size:14px;padding-left:40px;padding-right:50px;outline:none}
.search-input::placeholder{color:var(--t3)}

.filter-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:28px;height:28px;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center}
.filter-btn::before{content:'⋯';color:var(--t2);font-size:18px;letter-spacing:-2px}

/* Main Content */
.main-content{padding:12px}

/* Banner */
.banner{height:52px;background:linear-gradient(135deg,rgba(201,169,110,0.15) 0%,rgba(155,126,216,0.1) 100%);border-radius:10px;border:1px solid rgba(201,169,110,0.3);padding:16px;display:flex;align-items:center;justify-content:space-between}
.banner-text{font-size:14px;font-weight:600;color:var(--gold)}
.banner-arrow{color:var(--t2);font-size:12px}

/* Horizontal Cards */
.cards-section{margin-top:12px}
.cards-scroll{height:68px;display:flex;gap:8px;overflow-x:auto}
.cards-scroll::-webkit-scrollbar{display:none}
.scroll-card{min-width:120px;height:60px;background:var(--bg3);border-radius:8px;flex-shrink:0}
.scroll-card.active{background:linear-gradient(135deg,var(--bg3) 0%,var(--bg4) 100%);border:1px solid var(--gold)}

/* Section */
.section{margin-top:12px}
.section-header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.section-title{font-size:14px;font-weight:600;color:var(--t1)}
.section-more{font-size:12px;color:var(--t3)}

/* Script Cards */
.script-card{background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;gap:12px}
.script-card:last-child{margin-bottom:0}

.script-cover{width:70px;height:70px;background:var(--bg2);border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.script-emoji{font-size:28px}

.script-info{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px}
.script-name{font-size:15px;font-weight:600;color:var(--t1)}

.script-tags{display:flex;gap:6px;flex-wrap:wrap}
.script-tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:600}
.script-tag.blue{background:rgba(74,125,255,0.25);color:var(--blue)}
.script-tag.purple{background:rgba(155,126,216,0.25);color:var(--purple)}
.script-tag.green{background:rgba(76,175,147,0.25);color:var(--green)}

.script-meta{display:flex;align-items:center;justify-content:space-between}
.script-rating{color:var(--gold);font-size:13px;font-weight:600}
.script-players{color:var(--t3);font-size:11px}

/* Tab Bar */
.tab-bar{height:53px;background:rgba(16,23,40,0.97);border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:center;position:absolute;bottom:0;left:0;right:0;padding:0 20px}

.tab-item{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;padding:4px 8px}
.tab-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.tab-icon svg{width:18px;height:18px;stroke:var(--t2);stroke-width:1.5;fill:none}
.tab-label{font-size:10px;color:var(--t2)}

.tab-item.active .tab-icon svg{stroke:var(--gold)}
.tab-item.active .tab-label{color:var(--gold);font-weight:600}

/* Active indicator */
.tab-item.active::before{content:'';position:absolute;top:-1px;width:24px;height:2px;background:var(--gold);border-radius:1px}

/* Quick Button */
.quick-btn{position:relative;top:-16px}
.quick-btn .tab-icon{width:40px;height:40px;background:linear-gradient(135deg,#F5A623,#E8943C);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(245,166,35,0.4)}
.quick-btn .tab-icon svg{stroke:none;fill:white;width:20px;height:20px}
.quick-btn .tab-label{color:var(--gold);font-size:9px}
.quick-btn::before{display:none}

/* User Avatar in tab */
.user-avatar{width:18px;height:18px;background:var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:white;font-weight:600}
</style>
</head>
<body>
<div class="phone">
  <!-- Search Header -->
  <div class="search-area">
    <div class="search-container">
      <div class="search-box">
        <div class="search-icon"></div>
        <input type="text" class="search-input" placeholder="搜索剧本...">
      </div>
      <div class="filter-btn"></div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Banner -->
    <div class="banner">
      <span class="banner-text">🔥 热门推荐</span>
      <span class="banner-arrow">查看全部 ></span>
    </div>

    <!-- Horizontal Scroll Cards -->
    <div class="cards-section">
      <div class="cards-scroll">
        <div class="scroll-card"></div>
        <div class="scroll-card"></div>
        <div class="scroll-card"></div>
      </div>
    </div>

    <!-- Script List Section -->
    <div class="section">
      <div class="section-header">
        <span class="section-title">🏆 剧本排行</span>
        <span class="section-more">查看全部 ></span>
      </div>

      <!-- Script Card 1 -->
      <div class="script-card">
        <div class="script-cover">
          <span class="script-emoji">🎭</span>
        </div>
        <div class="script-info">
          <div class="script-name">山庄晚宴</div>
          <div class="script-tags">
            <span class="script-tag blue">本格</span>
            <span class="script-tag purple">推理</span>
          </div>
          <div class="script-meta">
            <span class="script-rating">⭐ 9.2</span>
            <span class="script-players">1285人玩过</span>
          </div>
        </div>
      </div>

      <!-- Script Card 2 -->
      <div class="script-card">
        <div class="script-cover">
          <span class="script-emoji">🎭</span>
        </div>
        <div class="script-info">
          <div class="script-name">午夜列车</div>
          <div class="script-tags">
            <span class="script-tag purple">社交</span>
            <span class="script-tag green">悬疑</span>
          </div>
          <div class="script-meta">
            <span class="script-rating">⭐ 8.8</span>
            <span class="script-players">892人玩过</span>
          </div>
        </div>
      </div>

      <!-- Script Card 3 -->
      <div class="script-card">
        <div class="script-cover">
          <span class="script-emoji">🎭</span>
        </div>
        <div class="script-info">
          <div class="script-name">古宅迷踪</div>
          <div class="script-tags">
            <span class="script-tag green">情感</span>
            <span class="script-tag blue">惊悚</span>
          </div>
          <div class="script-meta">
            <span class="script-rating">⭐ 9.0</span>
            <span class="script-players">654人玩过</span>
          </div>
        </div>
      </div>

      <!-- Script Card 4 -->
      <div class="script-card">
        <div class="script-cover">
          <span class="script-emoji">🎭</span>
        </div>
        <div class="script-info">
          <div class="script-name">雨夜追凶</div>
          <div class="script-tags">
            <span class="script-tag blue">本格</span>
          </div>
          <div class="script-meta">
            <span class="script-rating">⭐ 8.5</span>
            <span class="script-players">421人玩过</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <!-- 剧本 -->
    <div class="tab-item">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <span class="tab-label">剧本</span>
    </div>

    <!-- 广场 -->
    <div class="tab-item">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <span class="tab-label">广场</span>
    </div>

    <!-- 首页 (激活) -->
    <div class="tab-item active">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <span class="tab-label">首页</span>
    </div>

    <!-- 游玩 -->
    <div class="tab-item">
      <div class="tab-icon">
        <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
      </div>
      <span class="tab-label">游玩</span>
    </div>

    <!-- 我的 -->
    <div class="tab-item">
      <div class="tab-icon">
        <div class="user-avatar">我</div>
      </div>
      <span class="tab-label">我的</span>
    </div>
  </div>

  <!-- Quick Button (positioned in middle) -->
  <div style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10">
    <div style="width:48px;height:48px;background:linear-gradient(135deg,#F5A623,#E8943C);border-radius:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(245,166,35,0.5)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    </div>
  </div>
</div>
</body>
</html>
